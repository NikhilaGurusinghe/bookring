<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title></title>
  <link href="style.css" rel="stylesheet" />
</head>

<body>

  <div style="display: inline-flex; gap: 18px; align-items: center;" aria-label="Bookring navigation widget">
    <a href="https://nikhilagurusinghe.github.io/bookring/?action=previous" title="Previous Bookring site" referrerpolicy="unsafe-url" style="transition: transform .05s ease;" onmouseover="this.style.transform='scale(1.05)';" onmouseout="this.style.transform='scale(1)'">
        <img src="https://nikhilagurusinghe.github.io/bookring/images/webring_widget/previous.png" width="32px" aria-hidden="true"/>
        <span style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border-width: 0">
            Previous Bookring site
        </span>
    </a>
    <a href="https://nikhilagurusinghe.github.io/bookring/" title="Bookring (i.e. a book themed webring)" referrerpolicy="unsafe-url" style="transition: transform .05s ease;" onmouseover="this.style.transform='scaleX(1.125)'" onmouseout="this.style.transform='scale(1)'">
        <img src="https://nikhilagurusinghe.github.io/bookring/images/webring_widget/book.png" width="48px" aria-hidden="true"/>
        <span style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border-width: 0;">
            Bookring homepage
        </span>
    </a>
    <a href="https://nikhilagurusinghe.github.io/bookring/?action=next" title="Next Bookring site" referrerpolicy="unsafe-url" style="transition: transform .05s ease;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
        <img src="https://nikhilagurusinghe.github.io/bookring/images/webring_widget/next.png" width="32px" aria-hidden="true"/>
        <span style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border-width: 0;">
            Next Bookring site
        </span>
    </a>
  </div>
  
</body>

</html>
